name: Guess Chatter

on:
  push:
    branches: [main]
    paths:
      - 'guess_chatter.py'
      - 'guess_chess_chatter.py'
      - 'guess_leaderboard.py'
      - 'shared_leaderboard.py'
      - 'pets.py'
      - 'pet_ui.py'
      - 'showcase_cards.py'
      - 'profile_theme_art.py'
      - 'assets/profile_themes/**'
      - 'public_profiles.py'
      - 'assets/pets/**'
      - 'shop_catalog.py'
      - 'holiday_events.py'
      - 'badge_box_ui.py'
      - 'shop_color_roles.py'
  schedule:
    # Backup rotation only. The running controller also performs its own clean
    # handoff, because GitHub scheduled runs can be delayed or occasionally dropped.
    # Minute 43 avoids the busiest start-of-hour scheduling window.
    - cron: "43 0,5,10,15,20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # Required so a planned worker rotation can dispatch its replacement run.
  actions: write

concurrency:
  group: guess-games-persistent-controller
  cancel-in-progress: true

jobs:
  guess-games:
    runs-on: ubuntu-latest
    # Emergency ceiling only. Normal workers hand off after ~4h20.
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "discord.py==2.7.1" requests python-chess cairosvg cryptography

      - name: Verify new persistent Guess build
        run: |
          python -m py_compile guess_chatter.py holiday_events.py badge_box_ui.py shop_color_roles.py
          python -m unittest test_name_colors.py test_holidays.py
          python - <<'PY'
          import ast
          from pathlib import Path

          def constant(filename, name):
              tree = ast.parse(Path(filename).read_text(encoding="utf-8"))
              for node in tree.body:
                  if isinstance(node, ast.Assign):
                      for target in node.targets:
                          if isinstance(target, ast.Name) and target.id == name:
                              return ast.literal_eval(node.value)
              raise RuntimeError(f"{name} not found in {filename}")

          controller = constant("guess_chatter.py", "GUESS_CONTROLLER_BUILD")
          chatter = constant("guess_chatter.py", "GUESS_CHATTER_BUILD")
          chess = constant("guess_chess_chatter.py", "GUESS_CHESS_BUILD")

          assert controller == "guess-games-v7-buttons-trades-2026-09-08", controller
          assert chatter == "guess-chatter-v8-safety-twitch-2026-09-27", chatter
          assert chess == "guess-chess-v5-persistent-helper-2026-09-03", chess
          assert constant("guess_chatter.py", "POLL_DURATION_MINUTES") == 8
          assert constant("guess_chess_chatter.py", "POLL_DURATION_MINUTES") == 8

          controller_source = Path("guess_chatter.py").read_text(encoding="utf-8")
          chess_source = Path("guess_chess_chatter.py").read_text(encoding="utf-8")

          assert "async def scheduler_loop" in controller_source
          assert "No clock-based scheduler is started here." in controller_source
          assert "asyncio.create_task(scheduler_loop" not in controller_source
          assert '"!next"' in controller_source
          assert '"!l"' in controller_source
          assert "class GuessMainMenuView" in controller_source
          assert "class GuessTradeHomeView" in controller_source
          assert "class GuessOpenTradeView" in controller_source
          assert "class GuessNewHereView" in controller_source
          assert "GuessCatalogPager" in controller_source
          assert "class QuoteHuntContextView" in controller_source
          assert "Who wrote each option:" in controller_source
          assert "guess_workflow_rotation_loop" in controller_source
          assert ".guess_rotation_requested" in controller_source
          assert "client.close()" in controller_source
          assert "client.run(" not in chess_source

          print(f"Verified controller: {controller}")
          print(f"Verified chatter: {chatter}")
          print(f"Verified chess: {chess}")
          print("Verified Quote Hunt author/context reveal + planned workflow rotation.")
          PY

      - name: Run persistent Guess Games controller
        run: python guess_chatter.py
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GUESS_CHAT_KEY: ${{ secrets.GUESS_CHAT_KEY }}
          # 4h20: leave ample room for an active 8-minute poll to finish before
          # the workflow ceiling and then cleanly dispatch a fresh worker.
          GUESS_WORKFLOW_ROTATION_SECONDS: "15600"

      - name: Dispatch replacement after planned rotation
        # The marker is only created by a deliberate, graceful handoff.
        # Crashes/timeouts do not create restart loops.
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f .guess_rotation_requested ]; then
            echo "No planned Guess worker rotation requested."
            exit 0
          fi

          echo "Planned Guess rotation marker found; dispatching replacement worker."
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/guess_chatter.yml/dispatches" \
            -f ref="${GITHUB_REF_NAME:-main}"
          echo "Replacement Guess Chatter workflow dispatched."
