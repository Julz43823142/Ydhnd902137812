name: Chess.com Accuracy Optimizer (opt-in isolated research)

on:
  # Prepared only: every job also requires three explicit repository switches.
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

concurrency:
  group: chesscom-caps2-research-only
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reference-optimizer:
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.ACCURACY_OPTIMIZER_ENABLED == 'true' &&
      vars.ACCURACY_OPTIMIZER_COMPUTE_ISOLATED == 'true' &&
      vars.CHESSCOM_RESEARCH_WRITTEN_AUTHORIZATION == 'true'
    runs-on: ${{ vars.ACCURACY_OPTIMIZER_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      STATE_DIR: /tmp/sharkbot-accuracy-optimizer
      STATE_REPO: /tmp/sharkbot-accuracy-persistence
      CHESSCOM_RESEARCH_WRITTEN_AUTHORIZATION: 'true'
      ACCURACY_OPTIMIZER_STATE_KEY: ${{ secrets.ACCURACY_OPTIMIZER_STATE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated research dependencies
        run: python -m pip install python-chess requests cryptography
      - name: Restore encrypted reference-lab state
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ACCURACY_OPTIMIZER_STATE_KEY"
          gh auth setup-git --hostname github.com
          git clone --quiet --no-checkout . "$STATE_REPO"
          git -C "$STATE_REPO" remote set-url origin "$(git remote get-url origin)"
          if git fetch --no-tags --depth=1 origin refs/heads/caps2-research-state; then
            STATE_COMMIT=$(git rev-parse FETCH_HEAD)
            git -C "$STATE_REPO" fetch --quiet "$GITHUB_WORKSPACE" "$STATE_COMMIT"
            git -C "$STATE_REPO" checkout --quiet --detach FETCH_HEAD
          else
            git -C "$STATE_REPO" checkout --quiet --orphan accuracy-state
            git -C "$STATE_REPO" rm -rf --ignore-unmatch .
          fi
          BUNDLE="$STATE_REPO/research/caps2/optimizer/state.enc"
          if [[ -f "$BUNDLE" ]]; then
            python scripts/accuracy_optimizer.py unseal --state-dir "$STATE_DIR" --bundle "$BUNDLE"
          else
            mkdir -p "$STATE_DIR"
            echo "No encrypted reference dataset yet; no automatic collection will occur."
          fi
          if [[ -f "$STATE_DIR/dataset.json" ]]; then
            echo "dataset=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache@v4
        if: steps.restore.outputs.dataset == 'true'
        with:
          path: /tmp/stockfish19-official-pgo/Stockfish/src/stockfish
          key: stockfish-${{ runner.os }}-${{ runner.arch }}-edb0d9db6731067ec50ce619ff372b463bc4dd5d-pgo-v1
      - name: Prepare independent verified Stockfish
        if: steps.restore.outputs.dataset == 'true'
        run: python scripts/prepare_stockfish.py --github-env --profile-build
      - name: Run bounded reference experiments
        id: research
        continue-on-error: true
        run: >-
          python scripts/accuracy_optimizer.py run --state-dir "$STATE_DIR"
          --isolated --minutes 25 --trials 2000
      - name: Persist encrypted data and aggregate-only public status
        if: always() && steps.research.outcome != 'skipped' && steps.research.outcome != ''
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$STATE_REPO/research/caps2/optimizer"
          mkdir -p "$TARGET"
          python scripts/accuracy_optimizer.py seal --state-dir "$STATE_DIR" --bundle "$TARGET/state.enc"
          cp "$STATE_DIR/status.json" "$TARGET/status.json"
          cp "$STATE_DIR/runs.json" "$TARGET/runs.json"
          git -C "$STATE_REPO" config user.name 'github-actions[bot]'
          git -C "$STATE_REPO" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$STATE_REPO" add research/caps2/optimizer/state.enc research/caps2/optimizer/status.json research/caps2/optimizer/runs.json
          if ! git -C "$STATE_REPO" diff --cached --quiet; then
            git -C "$STATE_REPO" commit -m "research: checkpoint encrypted accuracy optimizer"
            git -C "$STATE_REPO" push origin HEAD:refs/heads/caps2-research-state
          fi
      - name: Publish honest result summary
        run: python scripts/accuracy_optimizer.py status --state-dir "$STATE_DIR" >> "$GITHUB_STEP_SUMMARY"
      - name: Surface worker failure after persistence
        if: steps.research.outcome == 'failure'
        run: exit 1
