name: Shark AI command security

on:
  pull_request:
    paths:
      - "shark_ai.py"
      - "shark_commands.py"
      - "shark_dispatch.py"
      - "test_shark_ai_safety.py"
      - "test_shark_commands.py"
      - "test_shark_dispatch.py"
      - ".github/workflows/shark_ai_commands_checks.yml"
  push:
    branches: [main]
    paths:
      - "shark_ai.py"
      - "shark_commands.py"
      - "shark_dispatch.py"
      - "test_shark_ai_safety.py"
      - "test_shark_commands.py"
      - "test_shark_dispatch.py"
      - ".github/workflows/shark_ai_commands_checks.yml"
permissions:
  contents: read

jobs:
  ai-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime library
        run: python -m pip install "discord.py==2.7.1"
      - name: Check Python syntax
        run: python -m py_compile shark_ai.py shark_commands.py shark_dispatch.py
      - name: Run isolated AI command tests
        run: python -m unittest -v test_shark_ai_safety test_shark_commands test_shark_dispatch
