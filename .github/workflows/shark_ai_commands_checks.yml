name: Shark AI command security

on:
  pull_request:
    paths:
      - "shark_ai.py"
      - "shark_public_help.py"
      - "test_shark_public_help.py"
      - "shark_puzzle_intent.py"
      - "shark_discord_knowledge.py"
      - "shark_stats_query.py"
      - "test_shark_stats_query.py"
      - "test_shark_215.py"
      - "test_shark_217.py"
      - "shark_state_privacy.py"
      - "shark_commands.py"
      - "shark_dispatch.py"
      - "test_shark_ai_safety.py"
      - "test_shark_state_privacy.py"
      - "test_shark_commands.py"
      - "test_shark_v2.py"
      - "test_shark_dispatch.py"
      - ".github/workflows/shark_ai_commands_checks.yml"
  push:
    branches: [main]
    paths:
      - "shark_ai.py"
      - "shark_public_help.py"
      - "test_shark_public_help.py"
      - "shark_puzzle_intent.py"
      - "shark_discord_knowledge.py"
      - "shark_stats_query.py"
      - "test_shark_stats_query.py"
      - "test_shark_215.py"
      - "test_shark_217.py"
      - "shark_commands.py"
      - "shark_dispatch.py"
      - "test_shark_ai_safety.py"
      - "test_shark_commands.py"
      - "test_shark_v2.py"
      - "test_shark_dispatch.py"
      - ".github/workflows/shark_ai_commands_checks.yml"
concurrency:
  group: shark_ai_commands_checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ai-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime library
        run: python -m pip install "discord.py==2.7.1" cryptography "python-chess==1.999"
      - name: Check Python syntax
        run: python -m py_compile shark_ai.py shark_puzzle_intent.py shark_discord_knowledge.py shark_commands.py shark_dispatch.py shark_state_privacy.py shark_public_help.py test_shark_public_help.py
      - name: Run isolated AI command tests
        run: python -m unittest -v test_shark_ai_safety test_shark_commands test_shark_dispatch test_shark_state_privacy test_shark_stats_query test_shark_215 test_shark_217 test_shark_public_help
