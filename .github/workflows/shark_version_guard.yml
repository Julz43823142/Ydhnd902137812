name: SharkBot release version guard

on:
  pull_request:
    branches: [main]

concurrency:
  group: shark_version_guard-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch main release version only
        run: git fetch origin "$GITHUB_BASE_REF" --depth=1
      - name: Validate major/minor SharkBot version changes
        run: |
          python - <<'PY'
          import ast
          import os
          import pathlib
          import subprocess

          def extract(source):
              tree = ast.parse(source)
              for item in tree.body:
                  if isinstance(item, ast.Assign) and any(
                      isinstance(t, ast.Name) and t.id == "SHARKBOT_VERSION"
                      for t in item.targets
                  ):
                      value = ast.literal_eval(item.value)
                      if type(value) is int and value > 0:
                          return value, 0
                      if isinstance(value, str):
                          parts = value.split(".")
                          if len(parts) == 2 and all(
                              p.isascii() and p.isdecimal() and str(int(p)) == p
                              for p in parts
                          ):
                              major, minor = map(int, parts)
                              if major > 0:
                                  return major, minor
              raise ValueError("Use SHARKBOT_VERSION = 'MAJOR.MINOR'.")

          current = extract(pathlib.Path("shark_version.py").read_text(encoding="utf-8"))
          base = os.environ["GITHUB_BASE_REF"]
          previous = subprocess.run(
              ["git", "show", "FETCH_HEAD:shark_version.py"],
              check=False, capture_output=True, text=True,
          )
          old = extract(previous.stdout) if previous.returncode == 0 else (1, 0)
          # A maintenance PR may keep the same public version only when the
          # version declaration itself is unchanged from the base branch.
          if current == old:
              if pathlib.Path("shark_version.py").read_text(encoding="utf-8") != previous.stdout:
                  raise SystemExit("Version declaration changed without a version increment.")
              print(f"SharkBot version unchanged: {old[0]}.{old[1]} (maintenance PR).")
              raise SystemExit(0)
          # One-time correction: the prior small test-only fix was mislabeled v3.
          correction = old == (3, 0) and current == (2, 1)
          patch = current[0] == old[0] and current[1] > old[1]
          major = current == (old[0] + 1, 0)
          if not (correction or patch or major):
              raise SystemExit(
                  f"SharkBot version must increment minor or major: "
                  f"main={old[0]}.{old[1]}, proposed={current[0]}.{current[1]}."
              )
          print(f"SharkBot version validated: {old[0]}.{old[1]} -> {current[0]}.{current[1]}")
          PY
