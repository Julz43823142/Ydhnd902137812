name: Review Partition Critical-Path Benchmark

on:
  pull_request:
    paths:
      - "scripts/benchmark_review_partition_balance.py"
      - ".github/workflows/review_partition_benchmark.yml"

permissions:
  contents: read

jobs:
  compare-14-shard-balancing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install python-chess requests cryptography
      - uses: actions/cache@v4
        with:
          path: /tmp/stockfish19-official-pgo/Stockfish/src/stockfish
          key: stockfish-${{ runner.os }}-${{ runner.arch }}-edb0d9db6731067ec50ce619ff372b463bc4dd5d-pgo-v1
      - name: Prepare same profile-guided Stockfish 19 binary as live review
        run: python scripts/prepare_stockfish.py --github-env --profile-build
      - name: Benchmark 14-shard workload skew at depth 18
        run: python scripts/benchmark_review_partition_balance.py
