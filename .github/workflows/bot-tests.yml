name: Offline Bot Tests

on:
  pull_request:
    paths:
      - '*.py'
      - 'assets/profile_themes/**'
      - 'minigames/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bot and minigame dependencies
        run: python -m pip install -r requirements.txt -r minigames/minigames_requirements.txt
      - name: Run offline bot and persistence tests
        run: python -m unittest discover -v
      - name: Run offline minigame tests
        run: python -m unittest discover -s minigames -p test_minigames.py
      - name: Compile Python sources
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/sharkbot-pycache
        run: python -m compileall -q -x '/\.git/' .
