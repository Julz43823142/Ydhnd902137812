name: Offline Bot Tests

on:
  pull_request:
    paths:
      - '*.py'
      - 'scripts/**'
      - 'assets/profile_themes/**'
      - 'minigames/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bot and minigame dependencies
        run: python -m pip install -r requirements.txt -r minigames/minigames_requirements.txt PyYAML
      - name: Run offline bot and persistence tests
        run: python -m unittest discover -v
      - name: Run offline minigame tests
        run: python -m unittest discover -s minigames -p test_minigames.py
      - name: Validate JSON and YAML
        run: python scripts/validate_repository_data.py
      - name: Check committed patch whitespace
        run: git diff --check HEAD~1 HEAD
      - name: Compile Python sources
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/sharkbot-pycache
        run: python -m compileall -q -x '/\.git/' .

  fairplay-legacy-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bot dependencies for synthetic detection tests
        run: python -m pip install -r requirements.txt
      - name: Verify positive and false-positive legacy HIGH selection
        run: |
          python -m unittest -v test_fairplay_legacy_candidate test_fairplay_end_to_end_audit test_fairplay_stop
          python -m unittest -v \
            test_fairplay_v6.PersonalCalibration.test_deep_baseline_improvement_erases_fast_anomaly \
            test_fairplay_status.AccountStatusIndependence.test_full_scoring_is_identical_with_hidden_open_or_closed_status \
            test_fairplay_v4.ExtendedHistory.test_adapter_is_capped_to_200_context_and_100_full_engine

  engine-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install engine review dependencies
        run: python -m pip install python-chess requests
      - uses: actions/cache@v4
        with:
          path: /tmp/stockfish19-official/Stockfish/src/stockfish
          key: stockfish-${{ runner.os }}-${{ runner.arch }}-edb0d9db6731067ec50ce619ff372b463bc4dd5d-v1
      - name: Prepare official Stockfish and export verified path
        env:
          STOCKFISH_PATH: /tmp/stockfish19-official/Stockfish/src/stockfish
        run: python scripts/prepare_stockfish.py --github-env
      - uses: actions/cache@v4
        with:
          path: /tmp/stockfish19-official-pgo/Stockfish/src/stockfish
          key: stockfish-${{ runner.os }}-${{ runner.arch }}-edb0d9db6731067ec50ce619ff372b463bc4dd5d-pgo-v1
      - name: Prepare official profile-guided Stockfish
        run: python scripts/prepare_stockfish.py --github-env --profile-build
      - name: Run synthetic two-pass Fair Play and normal Game Review smoke tests
        run: python scripts/smoke_stockfish_reviews.py
      - name: Verify real Stockfish position-queue evidence matches sequential search
        run: python scripts/smoke_fairplay_equivalence.py
      - name: Compare compact and standard fixed-node transports
        env:
          BASELINE_STOCKFISH_PATH: /tmp/stockfish19-official/Stockfish/src/stockfish
        run: python scripts/benchmark_fairplay_transport.py
      - name: Benchmark depth 18 versus current 24k-node Fair Play fast pass
        run: python scripts/benchmark_fairplay_depth18.py
      - name: Compile official Stockfish 18 with matching AVX2 build options
        run: |
          git clone -q --depth 1 --branch sf_18 https://github.com/official-stockfish/Stockfish.git /tmp/fairplay-stockfish18
          test "$(git -C /tmp/fairplay-stockfish18 rev-parse --short=7 HEAD)" = "cb3d4ee"
          make -C /tmp/fairplay-stockfish18/src -j2 build ARCH=x86-64-avx2
      - name: Compare Stockfish 18 and 19 at fixed depth 18
        run: python scripts/compare_stockfish18_19.py /tmp/fairplay-stockfish18/src/stockfish /tmp/stockfish19-official/Stockfish/src/stockfish

  depth18-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install python-chess requests
      - uses: actions/cache@v4
        with:
          path: /tmp/stockfish19-official-pgo/Stockfish/src/stockfish
          key: stockfish-${{ runner.os }}-${{ runner.arch }}-edb0d9db6731067ec50ce619ff372b463bc4dd5d-pgo-v1
      - run: python scripts/prepare_stockfish.py --github-env --profile-build
      - name: Verify full-game depth 18
        run: python scripts/smoke_fairplay_depth18.py

  human-model-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests python-chess
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-fairplay-human.txt
      - run: python scripts/prepare_fairplay_maia.py /tmp/sharkbot-maia/maia3-5m.pt --github-env
      - run: python scripts/smoke_fairplay_maia.py
      - uses: actions/cache@v4
        with:
          path: /tmp/stockfish19-official-pgo/Stockfish/src/stockfish
          key: stockfish-${{ runner.os }}-${{ runner.arch }}-edb0d9db6731067ec50ce619ff372b463bc4dd5d-pgo-v1
      - run: python scripts/prepare_stockfish.py --github-env --profile-build
      - run: python scripts/smoke_fairplay_policy.py
