name: Minigames
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'minigames/**'
      - '.github/workflows/minigames.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/minigames.yml'
      - 'minigames/**'
      - 'quests.py'
      - 'shared_leaderboard.py'
      - 'pets.py'
  schedule:
    - cron: '13 0,5,10,15,20 * * *'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r minigames/minigames_requirements.txt
      - name: Verify minigames
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile quests.py shared_leaderboard.py minigames/*.py
          python -m unittest test_quests.py
          python -m unittest discover -s minigames -p test_minigames.py
          python minigames/benchmark_minigames.py --samples 2

  minigames:
    permissions:
      contents: write
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: shark-minigames-controller
      cancel-in-progress: true
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r minigames/minigames_requirements.txt
      - name: Ensure board fonts
        run: |
          if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]; then
            sudo apt-get update
            sudo apt-get install -y fonts-dejavu-core
          fi
      - name: Run Minigames
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          MINIGAMES_STATE_KEY: ${{ secrets.MINIGAMES_STATE_KEY }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python minigames/minigames.py
