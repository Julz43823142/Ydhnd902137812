name: Minigames
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'minigames/**'
      - 'quests.py'
      - 'shared_leaderboard.py'
  schedule:
    - cron: '13 0,5,10,15,20 * * *'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r minigames/minigames_requirements.txt
      - name: Verify minigames
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile quests.py shared_leaderboard.py minigames/*.py
          python -m unittest test_quests.py
          python -m unittest discover -s minigames -p test_minigames.py

  minigames:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: shark-minigames-controller
      cancel-in-progress: true
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r minigames/minigames_requirements.txt
      - name: Ensure board fonts
        run: |
          if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]; then
            sudo apt-get update
            sudo apt-get install -y fonts-dejavu-core
          fi
      - name: Run Minigames
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          MINIGAMES_STATE_KEY: ${{ secrets.MINIGAMES_STATE_KEY }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python minigames/minigames.py
