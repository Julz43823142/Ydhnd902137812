name: Guess Chess Chatter

# Chess rounds are started manually by the single persistent Guess controller
# with `n`, `!n`, or `!next`. Keeping this workflow manual-only prevents a
# second Discord Gateway client from posting duplicate rounds.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guess-games-persistent-controller
  cancel-in-progress: true

jobs:
  restart-guess-games:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "discord.py==2.7.1" requests python-chess cairosvg

      - name: Verify Chess helper build
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          def constant(filename, name):
              tree = ast.parse(Path(filename).read_text(encoding="utf-8"))
              for node in tree.body:
                  if isinstance(node, ast.Assign):
                      for target in node.targets:
                          if isinstance(target, ast.Name) and target.id == name:
                              return ast.literal_eval(node.value)
              raise RuntimeError(f"{name} not found in {filename}")

          assert constant("guess_chatter.py", "GUESS_CONTROLLER_BUILD") == \
              "guess-games-v7-buttons-trades-2026-09-08"
          assert constant("guess_chess_chatter.py", "GUESS_CHESS_BUILD") == \
              "guess-chess-v5-persistent-helper-2026-09-03"
          print("Verified persistent Guess controller + Chess helper.")
          PY

      - name: Restart persistent Guess Games controller
        run: python guess_chatter.py
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
