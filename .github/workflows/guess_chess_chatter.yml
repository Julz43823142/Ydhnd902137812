name: Guess Chess Chatter

# Compatibility launcher only. The single persistent Guess Chatter controller
# owns BOTH normal Guess and Guess Chess rounds, so this workflow merely starts
# that controller instead of launching a second Discord Gateway client.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-controller:
    runs-on: ubuntu-latest
    steps:
      - name: Start the persistent Guess Games controller
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/guess_chatter.yml/dispatches" \
            -f ref="${GITHUB_REF_NAME:-main}"
          echo "Guess Chatter controller dispatched."
