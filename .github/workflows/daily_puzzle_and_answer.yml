name: Daily Puzzle

on:
  push:
    branches: [main]
    paths:
      - 'bot.py'
      - 'chess_play.py'
      - 'fairplay*.py'
      - 'scripts/prepare_stockfish.py'
      - 'scripts/*fairplay*'
      - 'requirements-fairplay-human.txt'
      - 'scripts/smoke_stockfish_reviews.py'
      - '.github/workflows/daily_puzzle_and_answer.yml'
      - 'pet_ui.py'
      - 'showcase_cards.py'
      - 'profile_theme_art.py'
      - 'assets/profile_themes/**'
      - 'public_profiles.py'
      - 'assets/pets/**'
      - 'shared_leaderboard.py'
      - 'pets.py'
      - 'shop_catalog.py'
      - 'holiday_events.py'
      - 'seasonal_bot_profile.py'
      - 'holiday_announcements.py'
      - 'assets/holiday_avatars/**'
      - 'badge_box_ui.py'
      - 'shop_color_roles.py'
      - 'piece_art.py'
      - 'quests.py'
      - 'puzzle_move_validation.py'
      - 'requirements.txt'
  schedule:
    # Backup rotation. GitHub notes that scheduled runs can be delayed or even
    # dropped under load, so bot.py also performs its own clean handoff.
    # Minute 37 deliberately avoids the busy start-of-hour window.
    - cron: "37 0,4,8,12,16,20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # Required for the worker to dispatch a fresh copy of this workflow after a
  # planned, state-synced rotation.
  actions: write

concurrency:
  group: daily-puzzle
  # Do not kill an active depth-18 scan when cron or a deployment arrives.
  # The current runner rotates itself after persisting work; the replacement
  # run stays pending until then.
  cancel-in-progress: false

jobs:
  run:
    # Optional dedicated self-hosted runner is needed for heavyweight
    # Allie 2.0/ChessMimic installations. Only use a trusted private runner
    # because this job receives DISCORD_TOKEN. Hosted runner stays default.
    runs-on: ${{ vars.SHARKBOT_DAILY_RUNNER || 'ubuntu-latest' }}
    # Emergency ceiling only. Normal workers hand off after ~4h20.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Prepare optional local Maia human reference
        continue-on-error: true
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-fairplay-human.txt
          python scripts/prepare_fairplay_maia.py /tmp/sharkbot-maia/maia3-5m.pt --github-env

      - name: Prepare supplementary Maia-3 23M and 79M local policies
        # Independent research-only observations; if unavailable, report
        # "unavailable" rather than altering LOW/HIGH outcomes.
        continue-on-error: true
        run: |
          python -m pip install git+https://github.com/CSSLab/maia3.git@1e13597c42d4858b7cfd7cfdae01e297263364b2
          python scripts/prepare_fairplay_maia_23m.py /tmp/sharkbot-maia/maia3-23m.pt --github-env
          python scripts/prepare_fairplay_maia_79m.py /tmp/sharkbot-maia/maia3-79m.pt --github-env

      - uses: actions/cache@v4
        with:
          path: /tmp/sharkbot-fairplay-lc0
          key: fairplay-lc0-v0.32.1-smallnet-portable-v2

      - name: Provision independent Lc0 CPU inference (optional)
        # Leela is observational only; build or network failure must not
        # prevent the Discord bot or required Stockfish depth-18 scan.
        continue-on-error: true
        timeout-minutes: 18
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libopenblas-dev libzstd-dev ninja-build pkg-config build-essential
          python -m pip install meson ninja
          python scripts/prepare_fairplay_lc0.py --provision --github-env

      - name: Restore official Stockfish 19 binary
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: /tmp/stockfish19-official-pgo/Stockfish/src/stockfish
          key: stockfish-${{ runner.os }}-${{ runner.arch }}-edb0d9db6731067ec50ce619ff372b463bc4dd5d-pgo-v1

      - name: Prepare and smoke-test Stockfish before Discord starts
        id: stockfish
        # Engine setup failure must not take puzzles, pets or Twitch offline.
        # Fair Play will return its explicit engine-unavailable failure instead.
        continue-on-error: true
        timeout-minutes: 10
        env:
          STOCKFISH_PATH: /tmp/stockfish19-official-pgo/Stockfish/src/stockfish
        run: python scripts/prepare_stockfish.py --github-env --profile-build

      - name: Verify both real engine review paths using synthetic data
        if: steps.stockfish.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        run: python scripts/smoke_stockfish_reviews.py

      - name: Verify Daily Puzzle build and offline RP pool
        run: |
          python -m py_compile bot.py puzzle_move_validation.py quests.py shared_leaderboard.py
          python -m unittest test_quests.py test_twitch_live_notifications.py test_name_colors.py test_bot_improvements.py test_holidays.py test_seasonal_bot_profile.py test_holiday_changes.py
          if [ -f test_puzzle_move_validation.py ]; then
            python -m unittest test_puzzle_move_validation.py
          else
            echo "test_puzzle_move_validation.py is not present; running built-in validator smoke tests instead."
            python - <<'PYTEST'
          import chess
          from puzzle_move_validation import match_solution_move, move_is_solution

          board = chess.Board()
          assert move_is_solution(board, "Nf3!", {"uci": "g1f3"})

          mate_board = chess.Board("7k/4Q1pp/8/8/8/8/8/K7 w - - 0 1")
          mates = []
          for move in list(mate_board.legal_moves):
              trial = mate_board.copy(stack=False)
              trial.push(move)
              if trial.is_checkmate():
                  mates.append(move)
          assert len(mates) >= 2
          accepted, played, kind = match_solution_move(
              mate_board,
              mate_board.san(mates[1]),
              {"uci": mates[0].uci()},
          )
          assert accepted and played == mates[1] and kind == "alternative_checkmate"
          print("Built-in puzzle validator smoke tests passed.")
          PYTEST
          fi
          python - <<'PY'
          import ast
          import os
          import sqlite3
          from pathlib import Path

          def constant(filename, name):
              tree = ast.parse(Path(filename).read_text(encoding="utf-8"))
              for node in tree.body:
                  if isinstance(node, ast.Assign):
                      for target in node.targets:
                          if isinstance(target, ast.Name) and target.id == name:
                              return ast.literal_eval(node.value)
              raise RuntimeError(f"{name} not found in {filename}")

          bot_build = constant("bot.py", "RP_BUILD")
          ledger_build = constant("shared_leaderboard.py", "LEDGER_BUILD")
          pool_file = constant("bot.py", "RP_POOL_FILE")

          assert bot_build == "daily-rp-v12-offline-pool-2026-09-03", bot_build
          assert ledger_build == "shared-ledger-v16-subscriber-pink-2026-09-29", ledger_build
          assert os.path.exists(pool_file), (
              f"{pool_file} is missing. Run the 'Build RP Puzzle Pool' workflow first."
          )

          con = sqlite3.connect(pool_file)
          try:
              total = con.execute("SELECT COUNT(*) FROM puzzles").fetchone()[0]
              counts = dict(con.execute(
                  "SELECT band, COUNT(*) FROM puzzles GROUP BY band ORDER BY band"
              ).fetchall())
          finally:
              con.close()

          assert total == 300000, total
          assert counts == {0:50000,1:50000,2:50000,3:50000,4:50000,5:50000}, counts

          source = Path("bot.py").read_text(encoding="utf-8")
          assert "lichess.org/api/puzzle/next" not in source
          assert "temporarily rate-limited (HTTP 429)" not in source
          assert "daily_workflow_rotation_loop" in source
          assert ".daily_rotation_requested" in source
          assert "await save_all_critical(attempts=5)" in source

          print(f"Verified bot build: {bot_build}")
          print(f"Verified ledger build: {ledger_build}")
          print(f"Verified offline RP pool: {total} puzzles")
          print("Verified clean Daily Actions self-rotation support.")
          PY

      - name: Run Daily Puzzle
        run: python bot.py
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          # Broad MultiPV1 screening of 500 rated games, with v22-selected
          # deep PV3 across up to 250 games and bounded Maia observations.
          # Opt-in only; inactive until this PR is independently merged.
          FAIRPLAY_FULL_DEPTH18: "1"
          FAIRPLAY_V21: "1"
          # v22: dispatch five independent encrypted Stockfish compute shards.
          # Merge/approval remains owner-only; the compute workflow is idle
          # until this controller explicitly dispatches a reviewed job.
          FAIRPLAY_DISTRIBUTED: "1"
          GITHUB_TOKEN: ${{ github.token }}
          FAIRPLAY_DISTRIBUTED_KEY: ${{ secrets.FAIRPLAY_DISTRIBUTED_KEY }}
          FAIRPLAY_REQUIRE_MAIA: "1"
          # Deterministic supplementary model observations on up to 48
          # temporally spread depth-completed games; never raise verdicts.
          FAIRPLAY_EXTERNAL_MODELS: "maia3_23m,maia3_79m,lc0,chessmimic,allie,allie_v2,allie_2,maia4all,kaladin,irwin"
          FAIRPLAY_EXTERNAL_MAX_POSITIONS: "48"
          FAIRPLAY_EXTERNAL_MAX_SECONDS: "600"
          # Optional host-provisioned models; these paths/URLs are NOT model weights.
          FAIRPLAY_ALLIE_2_MODEL_DIR: ${{ vars.FAIRPLAY_ALLIE_2_MODEL_DIR }}
          FAIRPLAY_ALLIE_2_REQUIRE_MEMORY_MB: "16000"
          FAIRPLAY_CHESSMIMIC_URL: ${{ vars.FAIRPLAY_CHESSMIMIC_URL }}
          FAIRPLAY_CHESSMIMIC_ACCEPT_LICENSE: ${{ vars.FAIRPLAY_CHESSMIMIC_ACCEPT_LICENSE }}
          FAIRPLAY_ALLIE_BRIDGE_URL: ${{ vars.FAIRPLAY_ALLIE_BRIDGE_URL }}
          FAIRPLAY_ALLIE_V2_BRIDGE_URL: ${{ vars.FAIRPLAY_ALLIE_V2_BRIDGE_URL }}
          FAIRPLAY_ALLIE_2_BRIDGE_URL: ${{ vars.FAIRPLAY_ALLIE_2_BRIDGE_URL }}
          FAIRPLAY_MAIA4ALL_BRIDGE_URL: ${{ vars.FAIRPLAY_MAIA4ALL_BRIDGE_URL }}
          # No unsafe automatic downloads of 11 GB Allie or noncommercial ChessMimic.
          # Install these on a separately resourced worker before enabling.
          SHARKMEISTER_USER_ID: "362606514764251137"
          TWITCH_EVENTSUB_ENABLED: "1"
          TWITCH_CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID }}
          TWITCH_BROADCASTER_ID: ${{ vars.TWITCH_BROADCASTER_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_ACCESS_TOKEN: ${{ secrets.TWITCH_ACCESS_TOKEN }}
          TWITCH_REFRESH_TOKEN: ${{ secrets.TWITCH_REFRESH_TOKEN }}
          # 4h20: safely below the 5h50 workflow ceiling while allowing normal
          # cron replacement to happen first when GitHub scheduling is healthy.
          DAILY_WORKFLOW_ROTATION_SECONDS: "15600"

      - name: Dispatch replacement after planned rotation
        # This marker only exists when bot.py has synced critical state and then
        # deliberately closed itself. Crashes do not create restart loops.
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f .daily_rotation_requested ]; then
            echo "No planned Daily worker rotation requested."
            exit 0
          fi

          echo "Planned rotation marker found; dispatching replacement worker."
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/daily_puzzle_and_answer.yml/dispatches" \
            -f ref="${GITHUB_REF_NAME:-main}"
          echo "Replacement Daily Puzzle workflow dispatched."
