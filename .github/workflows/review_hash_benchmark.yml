name: Review Hash Depth-18 Benchmark

on:
  pull_request:
    paths:
      - "scripts/benchmark_review_hash.py"
      - ".github/workflows/review_hash_benchmark.yml"
      - ".github/workflows/ordinary_review_distributed.yml"
      - "game_review_remote.py"

permissions:
  contents: read

jobs:
  compare-review-hash:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated engine dependencies
        run: python -m pip install python-chess requests cryptography
      - uses: actions/cache@v4
        with:
          path: /tmp/stockfish19-official-pgo/Stockfish/src/stockfish
          key: stockfish-${{ runner.os }}-${{ runner.arch }}-edb0d9db6731067ec50ce619ff372b463bc4dd5d-pgo-v1
      - name: Prepare pinned Stockfish 19 depth-18 engine
        run: python scripts/prepare_stockfish.py --github-env --profile-build
      - name: Compare hash on opening and tactical segments
        run: python scripts/benchmark_review_hash.py
